async function imprimirOS(id,w){

  var c=null;if(l.cliente_id){var rc=await sb.from('clientes').select('*').eq('id',l.cliente_id).maybeSingle();c=rc.data||null;}
  var eq=await sb.from('v_os_equipe').select('equipe').eq('lead_id',id).maybeSingle();var equipe=(eq.data&&eq.data.equipe)||'';
  w.document.open();w.document.write(osPrintHtml(l,c,equipe));w.document.close();
  var n=(l.impressoes||0)+1,agora=new Date().toISOString();
  var u=await sb.from('leads').update({impresso_em:agora,impresso_por:S.perfil.email,impressoes:n}).eq('id',id);if(u.error)throw u.error;
  await sb.from('lead_eventos').insert({lead_id:id,tipo:'sistema',texto:'OS impressa ('+n+'ª vez)'});
  (S.leads||[]).forEach(function(x){if(x.id===id){x.impresso_em=agora;x.impresso_por=S.perfil.email;x.impressoes=n;}});
  if(S.view==='chamado'&&S.tipo==='chamado')renderLista();
  if(S.lead&&S.lead.id===id&&el('modalbg')){S.lead.impresso_em=agora;S.lead.impresso_por=S.perfil.email;S.lead.impressoes=n;abrir(id).catch(fail);}
}

async function mostrarDoc(i){var v=S.viewer;v.idx=i;var d=v.docs[i];renderViewerList();var pane=el('vw-pane');pane.innerHTML='<span class="muted">Carregando…</span>';
  var r=await sb.storage.from(BUCKET).createSignedUrl(d.storage_path,600);if(r.error)throw r.error;var u=r.data.signedUrl;var mime=mimePorNome(d.nome);
  if(!mime){try{var resp=await fetch(u);var buf=new Uint8Array(await resp.arrayBuffer());mime=mimePorBytes(buf);if(mime)u=URL.createObjectURL(new Blob([buf],{type:mime}));}catch(e){}}
  if(v.idx!==i)return;var img=/^image\//.test(mime||'');
  pane.innerHTML='<div style="width:100%"><div style="display:flex;justify-content:flex-end;gap:6px;margin:6px"><a class="btn sec sm" href="'+u+'" target="_blank" rel="noopener">Abrir em nova aba</a></div>'+(img?'<div style="text-align:center"><img src="'+u+'" alt="'+esc(d.nome)+'"></div>':(mime==='application/pdf'?'<iframe src="'+u+'#toolbar=1" title="'+esc(d.nome)+'"></iframe>':'<div style="padding:30px;text-align:center;max-width:520px;margin:0 auto">'+(mime==='text/html'?'<p style="color:var(--red2)"><b>Este anexo não é um PDF: é uma página da internet</b> (provavelmente o link de compartilhamento do Adobe Scan / Acrobat salvo como arquivo).</p><p class="muted">No celular, abra o documento no Adobe Scan e use <b>Compartilhar › Copiar / Salvar PDF</b>, ou baixe o PDF pelo link antes de anexar. Depois apague este anexo e envie o PDF verdadeiro.</p>':'<p class="muted">Este arquivo ('+esc(d.nome)+') não pode ser exibido aqui. Use "Abrir em nova aba" para baixar.</p>')+'</div>'))+'</div>';}
function mimePorNome(n){n=String(n||'').toLowerCase();if(/\.pdf$/.test(n))return 'application/pdf';if(/\.(jpe?g)$/.test(n))return 'image/jpeg';if(/\.png$/.test(n))return 'image/png';if(/\.gif$/.test(n))return 'image/gif';if(/\.webp$/.test(n))return 'image/webp';return '';}
function mimePorBytes(b){if(b.length<4)return '';var h=String.fromCharCode(b[0],b[1],b[2],b[3]);if(h==='%PDF')return 'application/pdf';var t=String.fromCharCode.apply(null,b.slice(0,64)).toLowerCase();if(t.indexOf('<!doctype html')>-1||t.indexOf('<html')>-1)return 'text/html';if(h.slice(0,2)==='PK')return 'application/zip';if(b[0]===0x89&&h.slice(1)==='PNG')return 'image/png';if(b[0]===0xFF&&b[1]===0xD8)return 'image/jpeg';if(h==='GIF8')return 'image/gif';if(h==='RIFF'&&b.length>12&&String.fromCharCode(b[8],b[9],b[10],b[11])==='WEBP')return 'image/webp';return '';}
async function mimeDoArquivo(file){if(file.type)return file.type;var m=mimePorNome(file.name);if(m)return m;try{var b=new Uint8Array(await file.slice(0,16).arrayBuffer());return mimePorBytes(b)||'application/octet-stream';}catch(e){return 'application/octet-stream';}}
function docsHtml(D){if(!D.length)return '<p class="muted">Nenhum documento.</p>';return D.map(function(d){return '<div class="doc"><span>'+chip('',DOCT[d.tipo]||d.tipo)+'</span><span class="sp">'+esc(d.nome)+' <span class="muted">'+esc((d.enviado_por||'').split('@')[0])+' · '+esc(dd(d.created_at))+'</span></span><button class="btn sec sm" onclick="A.baixar(&quot;'+esc(d.storage_path)+'&quot;)">Abrir</button>'+(isAdmin()||d.enviado_por===S.perfil.email?'<button class="btn sec sm" onclick="A.apagarDoc(&quot;'+d.id+'&quot;,&quot;'+esc(d.storage_path)+'&quot;)">×</button>':'')+'</div>';}).join('');}
async function uploadDoc(entidade,id,tipo,file){
  var safe=file.name.replace(/[^\w.\-]+/g,'_');var path=entidade+'/'+id+'/'+Date.now()+'_'+safe;
  var mime=await mimeDoArquivo(file);if(!/\.[a-z0-9]{2,4}$/i.test(safe)){var ext={'application/pdf':'.pdf','image/jpeg':'.jpg','image/png':'.png','image/gif':'.gif','image/webp':'.webp'}[mime];if(ext){safe+=ext;path+=ext;}}
  var up=await sb.storage.from(BUCKET).upload(path,file,{contentType:mime});if(up.error)throw up.error;
  var r=await sb.from('documentos').insert({entidade:entidade,entidade_id:id,tipo:tipo,nome:file.name,storage_path:path,tamanho:file.size});if(r.error)throw r.error;
}
