<style>

.chip.urgente{background:var(--red);color:#fff}.chip.alta{background:#FDEBEA;color:var(--red2)}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy)}

.switch{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:14px}.switch button{flex:1;border:0;background:none;padding:7px;border-radius:999px;font-family:Sora,sans-serif;font-weight:600;font-size:13px;color:var(--gra);cursor:pointer}.switch button.on{background:var(--blue);color:#fff}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld label{font-size:12px;font-weight:500;color:var(--ink)}.fld input,.fld select,.fld textarea{padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;min-height:38px;width:100%;background:#fff}.fld textarea{min-height:70px;resize:vertical}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.frm .full{grid-column:1/-1}@media(max-width:640px){.frm{grid-template-columns:1fr}}
.note{font-size:12px;color:var(--sil)}.sec-t{font-family:Sora,sans-serif;font-weight:600;font-size:13px;color:var(--ink);margin:16px 0 6px;display:flex;align-items:center;gap:8px}.sec-t .sp{flex:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;max-width:90vw}#toast.err{background:var(--red)}
.modalbg{position:fixed;inset:0;background:rgba(10,26,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:900px;padding:22px;position:relative}.modal.sm{max-width:560px}.modal .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--sil)}
.det{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}@media(max-width:760px){.det{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:13px}.kv dt{color:var(--sil)}.kv dd{margin:0;color:var(--ink)}
.ev{border-left:2px solid var(--line);padding-left:12px;margin:8px 0}.ev .t{font-size:11px;color:var(--sil)}.ev p{margin:2px 0 0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-family:Sora,sans-serif;font-weight:600;font-size:12px;cursor:pointer;color:var(--gra)}.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stale{color:var(--red2);font-weight:600}.doc{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.doc .sp{flex:1}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sug{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 24px rgba(10,26,42,.14);z-index:5;max-height:260px;overflow:auto}.sug div{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}.sug div:hover{background:rgba(0,120,181,.06)}.sug b{color:var(--ink)}
.cats label{margin-right:12px;font-size:13px}
</style>

<script>
var SB_URL='https://puepmnyffpfjttxmwfjt.supabase.co';
var SB_KEY='sb_publishable_adOrRULrgbg_K9EqYHKMdQ_c4NK4Vbe';
var sb=window.supabase.createClient(SB_URL,SB_KEY,{db:{schema:'insiel'}});
var BUCKET='insiel';
var S={funcionarios:[],funcAtivos:[],equipeMap:{},clientes:[],cf:{q:'',cat:'',ativo:'sim'},cliente:null,perfil:null,view:'dash',tipo:'orcamento',leads:[],usuarios:[],f:{divisao:'',status:'',perfil:'',q:''},lead:null,eventos:[],custos:null,comprasLead:[],crLead:[],finTab:'resumo',compras:[],cp:[],cr:[],ff:{status:'',q:''},compra:null,conta:null};
var DIV={seguranca:'Segurança',solar:'Energia Solar',tecnologia:'Tecnologia',transito:'Trânsito'};
var PERF={residencia:'Residência',empresa:'Empresa',industria:'Indústria',orgao_publico:'Órgão público'};

var WA_MSG={seguranca:'Olá {nome}! Aqui é da Insiel Segurança Eletrônica. Recebemos seu pedido pelo site e quero entender melhor o que você precisa.',solar:'Olá {nome}! Aqui é da Insiel Energia Solar. Recebemos sua simulação pelo site e quero confirmar alguns dados para montar sua proposta.',tecnologia:'Olá {nome}! Aqui é da área de projetos da Insiel. Recebemos seu contato pelo site e quero agendar uma conversa.',transito:'Olá {nome}! Aqui é da área de trânsito da Insiel. Recebemos seu contato pelo site sobre controle semafórico.'};
var DET_LBL={servicos:'Serviços',sistema_existente:'Sistema existente',conta_luz:'Conta de luz',tipo_ligacao:'Ligação',orgao:'Órgão/empresa',cargo:'Cargo',necessidade:'Necessidade',mensagem:'Mensagem',problema:'Problema relatado',produto:'Produto'};
function esc(s){if(s===null||s===undefined)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function el(id){return document.getElementById(id);}function val(id){var e=el(id);return e?e.value.trim():'';}
function toast(m,err){var t=el('toast');if(t)t.remove();var d=document.createElement('div');d.id='toast';if(err)d.className='err';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},err?6000:3000);}
function fail(e){console.error(e);var m=(e&&e.message)?e.message:'Erro inesperado';if(/row-level security/.test(m))m='Sem permissão para esta ação (verifique seu papel na Mesa).';toast(m,true);}
function dt(d){if(!d)return '—';var x=new Date(d);return x.toLocaleDateString('pt-BR')+' '+x.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function dd(d){if(!d)return '—';var p=String(d).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ago(d){var h=(Date.now()-new Date(d).getTime())/36e5;if(h<1)return Math.round(h*60)+' min';if(h<48)return Math.round(h)+' h';return Math.round(h/24)+' dias';}
function money(n){if(n===null||n===undefined||n==='')return '—';return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function num(v){v=String(v||'').replace(/\./g,'').replace(',','.');var n=parseFloat(v);return isNaN(n)?null:n;}
function fone(w){w=String(w||'').replace(/\D/g,'');if(w.length===11)return '('+w.slice(0,2)+') '+w.slice(2,7)+'-'+w.slice(7);if(w.length===10)return '('+w.slice(0,2)+') '+w.slice(2,6)+'-'+w.slice(6);return w;}
function waLink(l){var w=String(l.whatsapp||'').replace(/\D/g,'');if(w&&w.indexOf('55')!==0)w='55'+w;var m=(WA_MSG[l.divisao]||WA_MSG.seguranca).replace('{nome}',(l.nome||'').split(' ')[0]);return 'https://wa.me/'+w+'?text='+encodeURIComponent(m);}
function chip(cls,txt){return '<span class="chip '+esc(cls)+'">'+esc(txt)+'</span>';}
function stLabel(l){return (l.tipo==='chamado'?ST_CH[l.status]:ST[l.status])||l.status;}
function brand(){return '<img src="img/logo-horizontal.png" alt="Insiel">';}
function isAdmin(){return S.perfil&&S.perfil.papel==='admin';}function isFin(){return S.perfil&&(S.perfil.papel==='admin'||S.perfil.papel==='financeiro');}
function detLista(d){if(!d||typeof d!=='object')return '';var h='';Object.keys(d).forEach(function(k){var v=d[k];if(Array.isArray(v))v=v.join(', ');if(v===''||v===null)return;h+='<dt>'+esc(DET_LBL[k]||k)+'</dt><dd>'+esc(v)+'</dd>';});return h;}
function sel(id,opts,v,attrs){return '<select id="'+id+'"'+(attrs||'')+'>'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';}
function modal(html,small){var m=el('modalbg');if(m)m.remove();document.body.insertAdjacentHTML('beforeend','<div class="modalbg" id="modalbg" onclick="if(event.target.id===&quot;modalbg&quot;)A.fechar()"><div class="modal'+(small?' sm':'')+'"><button class="x" onclick="A.fechar()">×</button>'+html+'</div></div>');}
function atras(r){return r.status!=='pago'&&r.status!=='cancelado'&&r.status!=='a_definir'&&r.vencimento&&r.vencimento<today();}
function chipCp(r){return atras(r)?chip('atrasado','Atrasado'):chip(r.status,STCP[r.status]||r.status);}
function chipCr(r){return atras(r)?chip('atrasado','Atrasado'):chip(r.status,STCR[r.status]||r.status);}
async function funcionarios(){if(!S.funcAtivos.length){var r=await sb.from('funcionarios').select('id,nome,funcao').eq('ativo',true).eq('funcao','tecnico').order('nome');if(!r.error)S.funcAtivos=r.data;}return S.funcAtivos;}
async function equipeMap(ids){var r=await sb.from('v_os_equipe').select('*').in('lead_id',ids);var m={};(r.data||[]).forEach(function(x){m[x.lead_id]=x;});S.equipeMap=m;return m;}
function equipeChips(sel,pre){sel=sel||[];return '<div class="chips" id="'+pre+'-eq">'+S.funcAtivos.map(function(f){return '<label class="chip"><input type="checkbox" name="'+pre+'-func" value="'+f.id+'"'+(sel.indexOf(f.id)>-1?' checked':'')+'><span>'+esc(f.nome)+'</span></label>';}).join('')+(S.funcAtivos.length?'':'<span class="muted">Nenhum técnico ativo cadastrado (Cadastro › Funcionários, função Técnico).</span>')+'</div>';}
function equipeSel(pre){return [].slice.call(document.querySelectorAll('input[name="'+pre+'-func"]:checked')).map(function(x){return x.value;});}
async function salvarEquipe(leadId,ids,antes){var a=(antes||[]).slice().sort().join(),b=ids.slice().sort().join();if(a===b)return false;await sb.from('os_funcionarios').delete().eq('lead_id',leadId);if(ids.length){var r=await sb.from('os_funcionarios').insert(ids.map(function(f){return {lead_id:leadId,funcionario_id:f};}));if(r.error)throw r.error;}var nomes=S.funcAtivos.filter(function(f){return ids.indexOf(f.id)>-1;}).map(function(f){return f.nome;});await sb.from('lead_eventos').insert({lead_id:leadId,tipo:'atribuicao',texto:'Equipe: '+(nomes.join(', ')||'(ninguém)')});return true;}
async function usuarios(){if(!S.usuarios.length){var u=await sb.from('usuarios').select('*').eq('ativo',true);if(!u.error)S.usuarios=u.data;}return S.usuarios;}

function showLogin(msg){

  '<div id="f-up" hidden><div class="fld"><label>E-mail autorizado</label><input id="su-email" type="email"></div><div class="fld"><label>Criar senha (mín. 8)</label><input id="su-senha" type="password" autocomplete="new-password"></div><div class="fld"><label>Repetir senha</label><input id="su-senha2" type="password" autocomplete="new-password"></div><button class="btn" style="width:100%" onclick="A.signup()">Criar acesso</button><p class="note">Somente e-mails autorizados pela Insiel conseguem ver os dados.</p></div>'+
  (msg?'<p class="note" style="text-align:center">'+esc(msg)+'</p>':'')+'</div></div>';
  var s=el('li-senha');if(s)s.addEventListener('keydown',function(ev){if(ev.key==='Enter')A.login();});
}
function showNoAccess(email){el('app').innerHTML='<div class="login"><div class="logincard">'+brand()+'<h1>Acesso não autorizado</h1><p>O e-mail <b>'+esc(email)+'</b> não está na lista de usuários da Mesa Insiel. Fale com o administrador.</p><button class="btn sec" style="width:100%;margin-top:14px" onclick="A.sair()">Sair</button></div></div>';}
async function enter(){
  var r=await sb.schema('public').rpc('insiel_minha_autorizacao');

  if(!r.data||!r.data.email){var u=await sb.auth.getUser();showNoAccess(u.data&&u.data.user?u.data.user.email:'');return;}
  S.perfil=r.data;renderShell();go('dash');
}
function renderShell(){

async function uploadDoc(entidade,id,tipo,file){
  var safe=file.name.replace(/[^\w.\-]+/g,'_');var path=entidade+'/'+id+'/'+Date.now()+'_'+safe;
  var up=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||'application/octet-stream'});if(up.error)throw up.error;
  var r=await sb.from('documentos').insert({entidade:entidade,entidade_id:id,tipo:tipo,nome:file.name,storage_path:path,tamanho:file.size});if(r.error)throw r.error;
}

  var c=await sb.from('v_compras').select('*').eq('chamado_id',id).order('created_at');S.os.compras=c.data||[];
  var it=await sb.from('os_itens').select('*').eq('lead_id',id).order('ordem');S.os.itens=(it.data||[]).map(function(x){return {descricao:x.descricao,quantidade:Number(x.quantidade),valor_unit:Number(x.valor_unit)};});

  abrirCliente:function(id){abrirCliente(id).catch(fail);},
  novoCliente:function(){modal('<h2>Novo cliente</h2>'+formCliente(null)+'<div class="acts"><button class="btn" onclick="A.salvarCliente(null)">Cadastrar</button><button class="btn sec" onclick="A.fechar()">Cancelar</button></div>');},
  salvarCliente:async function(id){try{var d=lerFormCliente();if(!d.nome)throw new Error('Informe o nome.');if(!d.categorias.length)throw new Error('Marque ao menos uma categoria.');var r=id?await sb.from('clientes').update(d).eq('id',id):await sb.from('clientes').insert(d);if(r.error)throw r.error;toast('Cliente salvo.');A.fechar();if(S.view==='clientes')loadClientes().catch(fail);}catch(e){fail(e);}},
  ativarCliente:async function(id,ativo){try{var r=await sb.from('clientes').update({ativo:ativo}).eq('id',id);if(r.error)throw r.error;toast(ativo?'Cliente reativado.':'Cliente inativado.');A.fechar();loadClientes().catch(fail);}catch(e){fail(e);}},
  buscaCliente:async function(q){var box=el('c-sug');if(!box)return;q=(q||'').trim();if(q.length<2){box.hidden=true;return;}var r=await sb.schema('public').rpc('insiel_buscar_clientes',{q:q});if(r.error||!r.data||!r.data.length){box.hidden=true;return;}
    S.sug=r.data;box.innerHTML=r.data.map(function(c,i){return '<div onclick="A.escolheCliente('+i+')"><b>'+esc(c.nome)+'</b> <span class="muted">'+esc(c.codigo_monitoramento||'')+' · '+esc(c.bairro||'')+' '+esc(c.cidade||'')+'</span></div>';}).join('');box.hidden=false;},
  escolheCliente:function(i){var c=typeof i==='number'?S.sug[i]:i;if(!c)return;el('c-cliid').value=c.id;el('c-nome').value=c.nome;if(c.telefones)el('c-wa').value=c.telefones;el('c-end').value=[c.endereco,c.numero].filter(Boolean).join(', ')+(c.bairro?' - '+c.bairro:'');if(c.cidade)el('c-cid').value=c.cidade;el('c-busca').value=c.nome;el('c-sug').hidden=true;el('c-clinfo').textContent='Cliente cadastrado'+(c.codigo_monitoramento?' · código '+c.codigo_monitoramento:'')+' · '+(c.categorias||[]).map(function(k){return CAT[k]||k;}).join(', ');},
  novoChamadoDe:async function(){try{var c=S.cliente;A.fechar();await novoChamado();if(c)A.escolheCliente({id:c.id,nome:c.nome,telefones:c.telefones||c.tel_sim,endereco:c.endereco,numero:c.numero,bairro:c.bairro,cidade:c.cidade,codigo_monitoramento:c.codigo_monitoramento,categorias:c.categorias});}catch(e){fail(e);}},
  addUser:async function(){try{var em=val('u-email').toLowerCase();if(!em)throw new Error('Informe o e-mail.');var r=await sb.from('usuarios').insert({email:em,nome:val('u-nome')||null,papel:val('u-papel')});if(r.error)throw r.error;toast('Usuário autorizado.');S.usuarios=[];loadUsuarios().catch(fail);}catch(e){fail(e);}},
  papel:async function(em,p){try{var r=await sb.from('usuarios').update({papel:p}).eq('email',em);if(r.error)throw r.error;toast('Papel atualizado.');}catch(e){fail(e);}},
  toggleUser:async function(em,ativo){try{var r=await sb.from('usuarios').update({ativo:ativo}).eq('email',em);if(r.error)throw r.error;S.usuarios=[];loadUsuarios().catch(fail);}catch(e){fail(e);}}
};
window.go=go;
sb.auth.onAuthStateChange(function(ev,session){if(ev==='SIGNED_IN'&&!S.perfil)enter().catch(fail);if(ev==='SIGNED_OUT'){S.perfil=null;showLogin();}});
sb.auth.getSession().then(function(r){if(r.data&&r.data.session)enter().catch(fail);else showLogin();});
</script>
</body>
</html>
